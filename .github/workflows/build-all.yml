# GitHub Actions 双端云打包（Android + iOS）
# Actions → Build All → Run workflow
# Android: Artifacts → openim-android-apk
# iOS: Artifacts → openim-ios-unsigned

name: Build All

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-all.yml"

jobs:
  android:
    uses: ./.github/workflows/android-release.yml

  ios:
    uses: ./.github/workflows/ios-unsigned.yml
