# GitHub Actions 未签名 iOS 云打包（备用）
# 推到 GitHub 后：Actions → iOS Unsigned → Run workflow
# 构建完成后在 Artifacts 下载 openim-ios-unsigned

name: iOS Unsigned

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - ".github/workflows/build-all.yml"
      - "pubspec.yaml"
      - "ios/**"
      - "lib/**"
      - "openim_common/**"
      - "openim_live/**"
      - "local_plugin/**"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Patch livekit WebRTC pod version
        run: |
          set -e
          PODSPEC=$(find "$PUB_CACHE" -path "*/livekit_client-*/ios/livekit_client.podspec" | head -1)
          if [ -z "$PODSPEC" ]; then
            echo "livekit_client podspec not found in pub cache"
            find "$PUB_CACHE" -name livekit_client.podspec || true
            exit 1
          fi
          sed -i '' "s/137.7151.03/137.7151.04/g" "$PODSPEC"
          echo "Patched $PODSPEC"
          grep WebRTC-SDK "$PODSPEC"

      - name: Build unsigned IPA
        run: |
          set -e
          flutter build ipa --release --no-codesign
          mkdir -p build/ios/ipa
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            echo "IPA already generated"
          elif [ -d build/ios/iphoneos/Runner.app ]; then
            rm -rf build/ios/ipa/Payload
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            (cd build/ios/ipa && zip -qry openim-unsigned.ipa Payload && rm -rf Payload)
          elif [ -d build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ]; then
            rm -rf build/ios/ipa/Payload
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
            (cd build/ios/ipa && zip -qry openim-unsigned.ipa Payload && rm -rf Payload)
          else
            echo "Runner.app not found, listing build/ios:"
            find build/ios -maxdepth 4 -type d | head -50
            exit 1
          fi
          ls -la build/ios/ipa/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openim-ios-unsigned
          # IPA only — uploading the full xcarchive is large and often times out.
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
