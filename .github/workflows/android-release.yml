# GitHub Actions Android 云打包
# Actions → Android Release → Run workflow
# 构建完成后在 Artifacts 下载 openim-android-apk

name: Android Release

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
    paths:
      - ".github/workflows/android-release.yml"
      - ".github/workflows/build-all.yml"
      - "pubspec.yaml"
      - "android/**"
      - "lib/**"
      - "openim_common/**"
      - "openim_live/**"
      - "local_plugin/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Patch Android plugins missing namespace
        run: |
          find "$PUB_CACHE/hosted/pub.dev" -path "*/android/build.gradle" | while read -r file; do
            if grep -q "com.android.library" "$file" && ! grep -q "namespace" "$file"; then
              group=$(grep "^group " "$file" | sed -n "s/group '\(.*\)'/\1/p" | head -1)
              [ -n "$group" ] || continue
              sed -i "/^android {/a\\    namespace '$group'" "$file"
              echo "Patched namespace in $file"
            fi
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openim-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
