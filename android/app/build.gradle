plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

android {
    namespace "io.openim"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { 
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "io.openim.flutter.demo"
        minSdkVersion flutter.minSdkVersion
        targetSdk 33
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // Getui + vendor push placeholders (Xiaomi etc. fill after opening vendor channel).
        manifestPlaceholders += [
                GETUI_APPID    : "gy41yoFqNV8bdYKPBDYwc7",
                GETUI_APP_ID   : "gy41yoFqNV8bdYKPBDYwc7",
                XIAOMI_APP_ID  : "",
                XIAOMI_APP_KEY : "",
                MEIZU_APP_ID   : "",
                MEIZU_APP_KEY  : "",
                HUAWEI_APP_ID  : "",
                OPPO_APP_KEY   : "",
                OPPO_APP_SECRET: "",
                VIVO_APP_ID    : "",
                VIVO_APP_KEY   : "",
                HONOR_APP_ID   : "",
        ]

        // Do not set ndk.abiFilters here when building with --split-per-abi;
        // Gradle rejects having both. ABI is controlled by Flutter build flags.
    }

    signingConfigs {
        release {
            keyAlias 'openim'
            keyPassword 'openim'
            storeFile file('./openim')
            storePassword 'openim'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        profile { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            // Keep release unminified. Dart --obfuscate is also disabled in CI
            // because GetX / plugins can crash on some OEM devices when names are mangled.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

    // Getui (mainland China offline push / OEM wake-up)
    implementation 'com.getui:gtsdk:3.3.12.0'
    implementation 'com.getui:gtc:3.2.18.0'
}

static def buildTime() {
    return new Date().format("MMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}
