flutter_native_splash:
  # Full-bleed HangXun splash from the first frame.
  background_image: "assets/splash_bg.png"
  fullscreen: true
  android_12:
    # System splash cannot be full-bleed; use the same art so it is never a blank blue.
    color: "#003A7A"
    image: assets/splash_bg.png
    icon_background_color: "#003A7A"
  web: false
